name: Publish reviewed Gmail reader once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'hullash007/mailpilot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify exact current files and source
        run: |
          git ls-remote --heads origin refs/heads/feature/current-gmail-reader-9ef2c1b > "$RUNNER_TEMP/reader-ref"
          test ! -s "$RUNNER_TEMP/reader-ref"
          git switch -c feature/current-gmail-reader-9ef2c1b
          python3 - <<'PYCODE'
          import hashlib,pathlib,zipfile,subprocess,stat
          assert subprocess.check_output(['git','merge-base','--is-ancestor','e7d6281e30ed892aaebe589aad2cbe5e4f0e59ce','HEAD'])==b''
          a=pathlib.Path('1-mailpilot-reader-source-9ef2c1b.zip')
          assert hashlib.sha256(a.read_bytes()).hexdigest()=='e98874c81408231c5d14f18911c2e08d2e97f27e0bbe1eabe0715392fd2695d4'
          expected={'README.md': 'dda2d4b6a7104452068c64d097a899006e7a66601649060b48b9902c1e5253a9', 'backend/app/gmail_reader_candidate.py': None, 'backend/app/gmail_reader_fixture.py': None, 'backend/app/integrations/gmail/reader_candidate.py': None, 'backend/app/integrations/gmail/reader_rest_candidate.py': None, 'backend/app/private_reader_candidate.py': None, 'backend/app/private_reader_entrypoint_candidate.py': None, 'backend/app/services/gmail_reader.py': None, 'backend/tests/test_gmail_reader_candidate.py': None, 'backend/tests/test_reader_rest_candidate.py': None}
          source={'README.md': '68123e9718f531cd45fc6452c41aa6e872cc7d6655ab89433f7d2006d726a3b4', 'backend/app/gmail_reader_candidate.py': '4009b1d9cb606cbd7a9a6ad0b877f6ac3071e60eba2bfca11f003b41c718aee3', 'backend/app/gmail_reader_fixture.py': '219364c2f199369f4bc4ddc11f78f9b5bb9f2b0848b69d8e8c4a9ff67e431071', 'backend/app/integrations/gmail/reader_candidate.py': 'cc3767ff1f25c66ca0287764f19c20b11bd8cda0eb965a8a0156031649740dad', 'backend/app/integrations/gmail/reader_rest_candidate.py': '4faa42c6c8529dc4122aa6b06bf51d437c6759bc6a2db8dcc027df6dd4d424b8', 'backend/app/private_reader_candidate.py': 'c6bfd01d813b5656657cb6e166db87a1e9397abc8ee2436bca3c409bdd33cbe7', 'backend/app/private_reader_entrypoint_candidate.py': '89d6f8eb862b5521323a1fd52a6d577d1382984642445eee53198a73bc67e90d', 'backend/app/services/gmail_reader.py': 'ec50210150c1330ba0665b54302f9d20d9b6a079859b18a90bf9a230efb349ed', 'backend/tests/test_gmail_reader_candidate.py': '8bb4bfeb23615a2ba7037649e7da5485873bab9171d07bbd18cc16bad997d089', 'backend/tests/test_reader_rest_candidate.py': 'b0a6950c1d762cd97acfd07ac3f0bfb76860d4f0bdc727cd8923a127e7965f8f'}
          with zipfile.ZipFile(a) as z:
              entries=z.infolist()
              assert len(entries)==len(source) and {i.filename for i in entries}==set(source)
              for i in entries:
                  p=pathlib.PurePosixPath(i.filename);f=pathlib.Path(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and '.github' not in p.parts and not i.is_dir() and not stat.S_ISLNK(i.external_attr>>16)
                  assert not any(x.is_symlink() for x in (f,*f.parents))
                  assert hashlib.sha256(z.read(i)).hexdigest()==source[i.filename]
                  assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.is_file() else None)==expected[i.filename]
              for i in entries:
                  f=pathlib.Path(i.filename);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(i));f.chmod(0o644)
          PYCODE
      - name: Commit editable reader source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all backend README.md
          git diff --cached --stat
          git commit -m 'Publish reviewed owner-private current Gmail reader'
          git push origin HEAD:refs/heads/feature/current-gmail-reader-9ef2c1b
