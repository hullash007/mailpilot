name: Publish qualified HTML reader once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'hullash007/mailpilot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify exact current files and source
        run: |
          git ls-remote --heads origin refs/heads/feature/html-text-reader-17ad387 > "$RUNNER_TEMP/reader-ref"
          test ! -s "$RUNNER_TEMP/reader-ref"
          git switch -c feature/html-text-reader-17ad387
          python3 - <<'PYCODE'
          import hashlib,pathlib,zipfile,subprocess,stat
          assert subprocess.check_output(['git','merge-base','--is-ancestor','1d53f26bfe247e97753e9571ac53cb12ef581b10','HEAD'])==b''
          a=pathlib.Path('1-1-mailpilot-html-source-17ad387.zip')
          assert hashlib.sha256(a.read_bytes()).hexdigest()=='eda73ffaaa799c28c1b816a0a8dea1ccf7e3a1bac0d2af5c52719ee94d1dec6b'
          expected={'README.md': '68123e9718f531cd45fc6452c41aa6e872cc7d6655ab89433f7d2006d726a3b4', 'backend/app/gmail_reader_candidate.py': '4009b1d9cb606cbd7a9a6ad0b877f6ac3071e60eba2bfca11f003b41c718aee3', 'backend/app/services/gmail_reader.py': 'ec50210150c1330ba0665b54302f9d20d9b6a079859b18a90bf9a230efb349ed', 'backend/app/services/mail_html_text.py': None, 'backend/tests/test_mail_html_text.py': None}
          source={'README.md': 'ac93aec7abede242b04e36589fa1fe7b082a05be8722b4447a7c7d6234f68c44', 'backend/app/gmail_reader_candidate.py': 'ee4330bd6f375e74af63c79783483856bf3b551f7157a62ff52623338c0239a8', 'backend/app/services/gmail_reader.py': '322ad80d544ab47afdd035337760e6aaddf537e3f425da1f84ced077d794d02f', 'backend/app/services/mail_html_text.py': '3f0b716430ce2870164ea412456d46f149007ecbf4ee15f25e644bf69ce0c0d3', 'backend/tests/test_mail_html_text.py': '9c19eaf1bd34357a6690d6337f14e79e5ed85023d71b11f6f9efbe64b29d9f1b'}
          with zipfile.ZipFile(a) as z:
              entries=z.infolist()
              assert len(entries)==len(source) and {i.filename for i in entries}==set(source)
              for i in entries:
                  p=pathlib.PurePosixPath(i.filename);f=pathlib.Path(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and '.github' not in p.parts and not i.is_dir() and not stat.S_ISLNK(i.external_attr>>16)
                  assert not any(x.is_symlink() for x in (f,*f.parents))
                  assert hashlib.sha256(z.read(i)).hexdigest()==source[i.filename]
                  assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.is_file() else None)==expected[i.filename]
              for i in entries:
                  f=pathlib.Path(i.filename);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(i));f.chmod(0o644)
          PYCODE
      - name: Commit editable reader source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all backend README.md
          git diff --cached --stat
          git commit -m 'Publish qualified HTML-only mail text reader'
          git push origin HEAD:refs/heads/feature/html-text-reader-17ad387
