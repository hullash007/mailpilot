services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mailpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - no default}
      POSTGRES_DB: mailpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mailpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mailpilot_pgdata:
